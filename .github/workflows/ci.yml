name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Check the copied skill
        shell: python
        run: |
          import os
          from pathlib import Path
          from shutil import copytree
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              skill = Path(temporary) / "ask-first-eda"
              copytree("skills/ask-first-eda", skill)
              subprocess.run(
                  [sys.executable, "-I", skill / "scripts" / "check_install.py"],
                  cwd=temporary, check=True,
              )

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimum runtime dependencies
        run: |
          sed 's/>=/==/g' requirements.txt > "$RUNNER_TEMP/minimum-constraints.txt"
          # The minimum pandas and PyArrow wheels use the NumPy 1.x ABI.
          python -m pip install -r requirements.txt -r requirements-dev.txt -c "$RUNNER_TEMP/minimum-constraints.txt" 'numpy<2'
      - name: Test
        run: python -m pytest -q
